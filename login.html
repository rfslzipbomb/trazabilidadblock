<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | La Favorita</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap');

    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-soft: #f9f9f9;
      --line: #e0e0e0;
      --text: #4a4a4a;
      --text-soft: #666666;
      --blue: #004d98;
      --blue-strong: #003366;
      --red: #e3000f;
      --red-strong: #b3000b;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 2.5vw, 28px);
    }

    h1, h2 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      color: var(--blue);
      letter-spacing: 0.5px;
      margin-top: 0;
    }

    .login-shell {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: min(78vh, 700px);
    }

    .brand-panel {
      background: linear-gradient(135deg, #004d98 0%, #003b73 100%);
      color: white;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 4px solid var(--red);
      position: relative;
      isolation: isolate;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.18), transparent 28%),
                  radial-gradient(circle at 80% 20%, rgba(227,0,15,0.22), transparent 28%),
                  linear-gradient(180deg, transparent, rgba(0,0,0,0.08));
      z-index: -1;
    }

    .brand-visual {
      width: min(100%, 270px);
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.22));
      animation: pulseShadow 3s ease-in-out infinite;
    }

    .brand-visual img {
      width: 100%;
      max-width: 220px;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      padding: 8px;
    }

    @keyframes pulseShadow {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));
      }
      50% {
        transform: translateY(-4px) scale(1.02);
        filter: drop-shadow(0 0 24px rgba(255,255,255,0.42));
      }
    }
    
    .brand-panel h1 {
      color: white;
      font-size: clamp(2rem, 3vw, 3.2rem);
      line-height: 1.1;
      text-align: center;
    }

    .subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      line-height: 1.7;
    }

    .form-panel {
      background: #ffffff;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .segment {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 10px;
    }

    .mode-button {
      border: 0;
      background: transparent;
      color: var(--text-soft);
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 5px 10px;
    }

    .mode-button.active {
      color: var(--red);
      border-bottom: 3px solid var(--red);
    }

    .form { display: none; }
    .form.active { display: block; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      margin-bottom: 15px;
      font-size: 15px;
    }

    input:focus { border-color: var(--blue); outline: none; }

    .btn {
      background: var(--red);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 24px;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn:hover { background: var(--red-strong); }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 13px;
    }
    .status.error { display: block; background: #fff1f3; color: var(--red-strong); border: 1px solid #ffd5db; }
    .status.success { display: block; background: var(--success-soft); color: #0e7a52; border: 1px solid #cbf1df; }

    @media (max-width: 820px) {
      html, body { height: auto; min-height: 100vh; }
      .login-shell { grid-template-columns: 1fr; min-height: auto; }
      .brand-panel { border-right: none; border-bottom: 4px solid var(--red); }
      .brand-visual { margin-bottom: 16px; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <section class="brand-panel">
      <div class="brand-visual">
        <img src="7861048615372-1-20.png" alt="Aceite La Favorita" />
      </div>
      <h1>LA FAVORITA ORIGINAL</h1>
      <p class="subtitle">Acceso seguro a trazabilidad de aceite. Consulta y gestión operativa para administración y usuarios.</p>
    </section>

    <section class="form-panel">
      <h2>Iniciar sesión</h2>
      
      <div class="segment">
        <button type="button" class="mode-button active" data-mode="admin">Administrador</button>
        <button type="button" class="mode-button" data-mode="external">Cliente Público</button>
      </div>

      <form id="adminForm" class="form active">
        <label>Usuario</label>
        <input id="adminUser" type="text" placeholder="admin" />
        <label>Contraseña</label>
        <input id="adminPass" type="password" placeholder="••••••••" />
        <button class="btn" type="submit">Entrar al panel</button>
      </form>

      <form id="externalForm" class="form">
        <p style="color:var(--text-soft); font-size:14px; margin-bottom:20px;">Accede directamente a la consulta de cliente sin requerir credenciales.</p>
        <button class="btn" type="submit">Entrar como cliente</button>
      </form>

      <div id="statusMessage" class="status"></div>
    </section>
  </div>

  <script>
    const modeButtons = document.querySelectorAll('.mode-button');
    const adminForm = document.getElementById('adminForm');
    const externalForm = document.getElementById('externalForm');
    const statusMessage = document.getElementById('statusMessage');

    function setMode(mode) {
      modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      adminForm.classList.toggle('active', mode === 'admin');
      externalForm.classList.toggle('active', mode === 'external');
      statusMessage.className = 'status';
      statusMessage.textContent = '';
    }

    modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

    function showStatus(type, text) {
      statusMessage.className = 'status ' + type;
      statusMessage.textContent = text;
    }

    adminForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      if (!user || !pass) return showStatus('error', 'Debes completar usuario y contraseña.');
      if (user !== 'admin' || pass !== 'admin123') return showStatus('error', 'Credenciales incorrectas.');
      
      showStatus('success', 'Redirigiendo al panel...');
      setTimeout(() => window.location.href = 'index.html', 800);
    });

    externalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      showStatus('success', 'Accediendo a la consulta...');
      setTimeout(() => window.location.href = 'consulta-usuario.html', 600);
    });
  </script>
</body>
</html>
